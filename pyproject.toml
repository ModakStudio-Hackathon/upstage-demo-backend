[project]
name = "upstage-demo-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JiSeong Lee", email = "cocoquiet@knu.ac.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "dotenv>=0.9.9",
    "fastapi>=0.162.2",
    "openai>=3.46.0",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
upstage-demo-backend = "upstage_demo_backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
